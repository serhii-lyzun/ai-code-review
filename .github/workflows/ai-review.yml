name: AI Review

# Phase 1: comment-only. Claude reviews the PR and posts inline comments; the
# workflow posts (and updates) one summary comment from Claude's structured
# result, and the ai-review-gate job reports pass/fail. Nothing is pushed or merged.
#
# Opt-in: the review runs only on PRs labelled `ai-review` (review locally with
# the reviewer agent first; add the label when you want the CI confirmation).
# Adding the label starts a review; later pushes re-review while it stays on.
# Without the label, or with the AI_AGENTS_ENABLED kill switch off, the review
# is skipped and ai-review-gate passes. Removing the label opts out: the gate
# passes again (and cancels a review that is still running).
#
# Adding or removing any OTHER label also runs this workflow. Those runs never
# review; the gate repeats the commit's previous gate result (see the gate job).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  # Runs for other labels get their own group, so they can't cancel a review
  # that is in progress.
  group: >-
    ai-review-${{ github.event.pull_request.number }}${{
    (github.event.action == 'labeled' || github.event.action == 'unlabeled')
    && github.event.label.name != 'ai-review'
    && format('-other-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

# No token access by default; the review job grants itself what it needs.
permissions: {}

jobs:
  review:
    # Kill switch, opt-in label, skip drafts, skip forks and Dependabot PRs
    # (no access to secrets there). Label events only start a review when the
    # `ai-review` label itself was added; removing a label never reviews.
    if: >-
      vars.AI_AGENTS_ENABLED == 'true' &&
      contains(github.event.pull_request.labels.*.name, 'ai-review') &&
      github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review') &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No id-token: github_token is passed explicitly, so the action doesn't need
    # OIDC to mint a Claude GitHub App token.
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.base_ref }}
      CONTEXT_DIR: .ai-review
    outputs:
      verdict: ${{ steps.parse.outputs.verdict }}
      blocking: ${{ steps.parse.outputs.blocking }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The rule files that drive the gate come from the base branch, so a PR
      # can't weaken its review by editing them. A file falls back to the PR's
      # copy only while it doesn't exist on base yet (the PR that adds it).
      #
      # Limit: pull_request runs THIS workflow file from the PR, so a PR that
      # edits ai-review.yml itself can still change the prompt or the gate.
      # Only CODEOWNERS on /.github/ plus a ruleset requiring code-owner review
      # guards that. Enable it before making ai-review-gate a required check.
      #
      # The action later restores .claude/ from base on its own, with no
      # fallback, so the reviewer instructions are copied to CONTEXT_DIR here,
      # where that restore doesn't touch them.
      - name: Use review rules from base branch
        run: |
          set -euo pipefail
          mkdir -p "$CONTEXT_DIR"
          from_base_or_pr() {  # <path in repo> <destination>
            if git cat-file -e "origin/$BASE_REF:$1" 2>/dev/null; then
              git show "origin/$BASE_REF:$1" > "$2"
              echo "Using $1 from $BASE_REF"
            elif [ -f "$1" ]; then
              [ "$1" = "$2" ] || cp "$1" "$2"
              echo "::warning file=$1::$1 doesn't exist on $BASE_REF yet; using the PR's version"
            else
              echo "::error file=$1::$1 is missing on both $BASE_REF and the PR"
              exit 1
            fi
          }
          from_base_or_pr REVIEW.md REVIEW.md
          from_base_or_pr CODE_CONVENTIONS.md CODE_CONVENTIONS.md
          from_base_or_pr CLAUDE.md CLAUDE.md
          from_base_or_pr .claude/schemas/review-findings.json "$CONTEXT_DIR/review-findings.json"
          from_base_or_pr .claude/agents/reviewer.md "$CONTEXT_DIR/reviewer.md"

      - name: Load findings schema
        id: schema
        run: |
          set -euo pipefail
          json=$(jq -c . "$CONTEXT_DIR/review-findings.json")
          # claude_args wraps the schema in single quotes, so it must not contain one.
          if [[ "$json" == *"'"* ]]; then
            echo "::error file=.claude/schemas/review-findings.json::Schema must not contain single quotes (it is passed single-quoted in claude_args)"
            exit 1
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"

      # Earlier inline comments from this workflow, so Claude doesn't post the
      # same finding again on every push. line == null means GitHub marked the
      # comment outdated (the code it pointed at changed).
      - name: Collect existing inline comments
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]")
                  | {path, line, outdated: (.line == null), title: (.body | split("\n")[0])}' \
            | jq -s . > "$CONTEXT_DIR/existing-comments.json"
          echo "Existing inline comments: $(jq length "$CONTEXT_DIR/existing-comments.json")"

      - name: Claude review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The fixer's pushes come from the ai-fixer App, and the action refuses
          # bot-triggered runs unless the bot is listed. Only that bot, never '*'.
          allowed_bots: ai-code-review-fixer,ai-code-review-fixer[bot]
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read .ai-review/reviewer.md and follow its instructions exactly. You are that reviewer.
            That file and .ai-review/review-findings.json are the base-branch versions of
            .claude/agents/reviewer.md and .claude/schemas/review-findings.json.

            The PR branch is already checked out, except that REVIEW.md, CODE_CONVENTIONS.md,
            CLAUDE.md and .claude/ hold the base-branch versions: those are the rules to apply. If the
            PR changes them, review those changes from `gh pr diff`, not from the working tree.
            You are running in CI. The only commands available are `git diff`, `git log`, `git show`,
            `gh pr view <n> --json ...` and `gh pr diff`, plus Read/Grep/Glob and the inline-comment
            tool. Don't run npm; the separate `ci` check covers lint, build and tests.

            Posting:
            - .ai-review/existing-comments.json lists inline comments from earlier reviews of this PR
              (path, line, outdated, title = first line of the comment).
            - For each finding, post one inline comment with mcp__github_inline_comment__create_inline_comment
              (confirmed: true), UNLESS a non-outdated existing comment on the same path is about the
              same problem. Then skip posting, but still include the finding in the structured result.
            - Start each inline comment body with the severity in brackets, e.g. "[major] <title>",
              then the message and the suggestion.
            - Don't post a summary comment and don't send review text as chat messages. The workflow
              posts the summary from your structured result.

            Finally return the structured result (verdict, summary, findings), covering ALL current
            findings, including ones you didn't post again.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '${{ steps.schema.outputs.json }}'

      # Without a structured result the next step only says "no structured
      # result". Say why, from the action's execution file: max turns, an API
      # or auth error, or a run that never reached the model (num_turns 1,
      # cost 0). Inline, not a repo script, so no PR code runs in this job.
      # The raw text is printed with workflow commands stopped, because it can
      # quote untrusted input.
      - name: Explain a missing result
        if: always() && steps.claude.outcome != 'skipped' && steps.claude.outputs.structured_output == ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -uo pipefail
          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            reason="no execution file: the action failed before Claude ran (see the Claude step's log)"
          else
            reason=$(jq -r '
              ([.[] | select(.type == "result")] | last) as $r
              | if $r == null then
                  "Claude never finished (no result message). Last text: "
                    + ([.[] | select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text] | last // "none")
                else
                  "\($r.subtype // "unknown"), is_error \($r.is_error | tostring), \($r.num_turns // "n/a") turns, $\($r.total_cost_usd // 0)"
                    + (if (($r.errors // []) | length) > 0 then ". Errors: " + ($r.errors | map(tostring) | join("; ")) else "" end)
                    + (if ($r.result // "") != "" then ". Result: " + ($r.result | tostring) else "" end)
                end' "$EXEC_FILE" 2>&1)
          fi
          token="stop-$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          printf '%s\n' "$reason"
          echo "::$token::"
          one_line=$(printf '%s' "$reason" | tr '\r\n' '  ' | head -c 900)
          echo "::error::Claude returned no structured result: $one_line"
          {
            echo "### No structured result from Claude"
            echo
            echo '```text'
            printf '%s\n' "$reason" | head -c 3000 | sed 's/```/` ` `/g'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parse result
        id: parse
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          if [ -z "$RESULT" ]; then
            echo "::error::Claude returned no structured result"
            exit 1
          fi
          echo "$RESULT" > findings.json
          blocking=$(jq '[.findings[] | select(.severity == "blocker" or .severity == "major")] | length' findings.json)

          # The verdict is derived from the findings, the same rule the gate
          # uses, so the summary title and the gate can't disagree.
          if [ "$blocking" = "0" ]; then verdict=pass; else verdict=changes_requested; fi
          reported=$(jq -r '.verdict' findings.json)
          if [ "$reported" != "$verdict" ]; then
            echo "::warning::Claude reported verdict '$reported' but the findings imply '$verdict'; using '$verdict'"
          fi
          jq --arg v "$verdict" '.verdict = $v' findings.json > findings.tmp && mv findings.tmp findings.json

          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"

          # Markdown findings table, shared by the PR comment and the job summary.
          # Pipes are escaped, and the location uses a double-backtick code span,
          # so a pipe or backtick in a path or title doesn't break the table.
          {
            echo "| Severity | Location | Title |"
            echo "| --- | --- | --- |"
            jq -r '.findings[]
              | "| \(.severity) | `` \(.file | gsub("\\|"; "\\|")):\(.line) `` | \(.title | gsub("\\|"; "\\|")) |"' findings.json
          } > findings-table.md

      # One summary comment per PR, found by a hidden marker and edited in place
      # on every push, so summaries don't pile up.
      - name: Post or update summary comment
        if: steps.parse.outcome == 'success'
        env:
          VERDICT: ${{ steps.parse.outputs.verdict }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          marker='<!-- ai-review-summary -->'
          if [ "$VERDICT" = "pass" ]; then title="pass"; else title="changes requested"; fi
          {
            echo "$marker"
            echo "## AI review: $title"
            echo
            jq -r .summary findings.json
            echo
            if [ "$(jq '.findings | length' findings.json)" -gt 0 ]; then
              cat findings-table.md
            else
              echo "No findings."
            fi
            echo
            echo "<sub>Reviewed commit ${SHA:0:7} · updated on every push</sub>"
          } > summary-comment.md

          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@summary-comment.md > /dev/null
            echo "Updated summary comment $id"
          else
            gh pr comment "$PR" --body-file summary-comment.md
          fi

      - name: Job summary (findings + cost)
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          {
            echo "## AI review"
            if [ -f findings.json ]; then
              echo "**Verdict:** $(jq -r .verdict findings.json)"
              echo
              cat findings-table.md
            fi
            if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then
              echo
              jq -r '[.[] | select(.type == "result")] | last
                | "**Cost:** $\(.total_cost_usd // "n/a") · **Turns:** \(.num_turns // "n/a") · **Duration:** \((.duration_ms // 0) / 1000)s"' \
                "$EXEC_FILE" || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-review-findings
          path: findings.json
          if-no-files-found: ignore

  ai-review-gate:
    # always(): a failed or cancelled review must fail the gate, not skip it
    # (GitHub treats a skipped required check as passing). An intentionally
    # skipped review (kill switch, no ai-review label, draft, fork, Dependabot)
    # passes.
    #
    # Adding or removing an unrelated label also runs this workflow with the
    # review skipped. GitHub uses the newest ai-review-gate result for a
    # commit, so passing here would overwrite an earlier failure. Those runs
    # repeat the previous completed gate result for the same commit, and pass
    # only if it passed; with no completed result at all they fail.
    # Limit: that previous result can predate a review that is still running
    # (e.g. the skipped-review pass from `opened`, before `ai-review` was
    # added). The running review's gate replaces it when it finishes, so wait
    # for the review before merging.
    needs: review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      - name: Fail on blocker/major findings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          RESULT: ${{ needs.review.result }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          BLOCKING: ${{ needs.review.outputs.blocking }}
        run: |
          set -euo pipefail
          echo "Review job: $RESULT · verdict: $VERDICT · blocking findings: $BLOCKING"

          if { [ "$ACTION" = "labeled" ] || [ "$ACTION" = "unlabeled" ]; } && [ "$LABEL" != "ai-review" ]; then
            previous=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ai-review-gate&per_page=100" \
              --jq '[.check_runs[] | select(.status == "completed")] | sort_by(.completed_at) | last | .conclusion // "none"')
            echo "Unrelated label '$LABEL' ($ACTION); previous gate result for ${SHA:0:7}: $previous"
            case "$previous" in
              success|neutral|skipped) exit 0 ;;
              *)
                echo "::error::No passing ai-review-gate result for ${SHA:0:7} yet ($previous)"
                exit 1
                ;;
            esac
          fi

          if [ "$RESULT" = "skipped" ]; then exit 0; fi
          test "$RESULT" = "success" && test "$BLOCKING" = "0"
