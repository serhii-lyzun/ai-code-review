name: Claude

# Interactive Claude: mention @claude in an issue, a PR comment, a PR review or
# a review comment to ask a question or request a change. It runs only when
# mentioned, only for the repo owner and collaborators, and only while the
# AI_AGENTS_ENABLED kill switch is on.
#
# Claude acts as the Claude GitHub App (installed with /install-github-app).
# It loads the same CI-only guardrails as the fixer (.claude/ci-fixer-settings.json):
# it can't edit .github/, .claude/, CLAUDE.md, REVIEW.md, package files or
# src/test/, and can't add @ts-ignore, lint-disable or .skip/.only. Anything it
# pushes goes through the normal PR checks and the main ruleset.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    # The mention, from someone trusted. author_association is the commenter's
    # relationship to the repo; OWNER, MEMBER and COLLABORATOR have been
    # granted access, so outsiders (including on this public repo) can't start
    # paid runs or steer Claude.
    if: >-
      vars.AI_AGENTS_ENABLED == 'true' && (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # exchanged for a Claude GitHub App token
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          settings: .claude/ci-fixer-settings.json
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
